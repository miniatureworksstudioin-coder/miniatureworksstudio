[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "index.html"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,ADMIN_PIN,ADMIN_SESSION_SECRET,BREVO_API_KEY,BREVO_SENDER_EMAIL,NOTIFICATION_EMAIL"

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/order-status"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/cancel-order"
  to = "/.netlify/functions/cancel-order"
  status = 200

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin/orders"
  to = "/.netlify/functions/admin-orders"
  status = 200

[[redirects]]
  from = "/api/find-orders"
  to = "/.netlify/functions/find-orders"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/request-otp"
  to = "/.netlify/functions/request-otp"
  status = 200

[[redirects]]
  from = "/api/verify-otp"
  to = "/.netlify/functions/verify-otp"
  status = 200

[[redirects]]
  from = "/api/notify-status"
  to = "/.netlify/functions/notify-status"
  status = 200

[[redirects]]
  from = "/api/notify-cancellation"
  to = "/.netlify/functions/notify-cancellation"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"